name: Refresh fight data and website

on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: firebase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clean-container:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build clean image with pinned dependencies and prebuilt model
        run: docker build --pull --no-cache -t mma-cipher-clean .
      - name: Verify ready and unready server processes
        run: |
          docker run -d --name cipher-ready -p 127.0.0.1:8088:8000 mma-cipher-clean python app.py --no-sync
          python3 scripts/container_smoke.py http://127.0.0.1:8088
          docker run -d --name cipher-unready -p 127.0.0.1:8089:8000 -e PREBUILT_DATA_DIR=/unavailable -e DATA_DIR=/tmp/empty mma-cipher-clean python app.py --no-sync
          python3 scripts/container_smoke.py http://127.0.0.1:8089 --expect-unready
      - name: Container logs
        if: always()
        run: |
          docker logs cipher-ready 2>&1 || true
          docker logs cipher-unready 2>&1 || true
  refresh:
    needs: clean-container
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.clean-container.result == 'success' || needs.clean-container.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install updater
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip check
          python -m playwright install --with-deps chromium
          npm install --global firebase-tools@15.33.0
      - name: Test source changes
        if: github.event_name != 'schedule'
        run: python -m pytest -q
      - name: Restore model cache
        uses: actions/cache/restore@v4
        with:
          path: data/model.joblib
          key: model-v1-${{ runner.os }}-${{ hashFiles('requirements.txt', 'predictor/model.py') }}-${{ github.run_id }}
          restore-keys: model-v1-${{ runner.os }}-${{ hashFiles('requirements.txt', 'predictor/model.py') }}-
      - name: Refresh verified data
        id: refresh
        continue-on-error: true
        run: python scripts/refresh_site.py --restore-url https://mma-oracle.web.app/api/sync-state.json.gz
      - name: Require complete publication
        run: python scripts/verify_publication.py
      - name: Verify browser layouts and portraits
        if: github.event_name != 'schedule'
        run: |
          python app.py --no-sync > /tmp/mma-cipher-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/mma-cipher-browser.log' EXIT
          python scripts/container_smoke.py http://127.0.0.1:8000
          python tests/browser_design.py
      - name: Save model cache
        uses: actions/cache/save@v4
        with:
          path: data/model.joblib
          key: model-v1-${{ runner.os }}-${{ hashFiles('requirements.txt', 'predictor/model.py') }}-${{ github.run_id }}
      - name: Authenticate to Firebase Hosting
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          project_id: mma-oracle
          workload_identity_provider: projects/196295291462/locations/global/workloadIdentityPools/mma-cipher-github/providers/github
          service_account: mma-cipher-publisher@mma-oracle.iam.gserviceaccount.com
      - name: Publish website and fight state together
        run: firebase deploy --only hosting --project mma-oracle --non-interactive --message '[mma-cipher-auto] Scheduled data and website update'
      - name: Verify production APIs, HTML, and persisted state
        run: python scripts/verify_publication.py --url https://mma-oracle.web.app
      - name: Retain recent automated snapshots
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/hosting_retention.py
      - name: Restore search-engine notification state
        uses: actions/cache/restore@v4
        with:
          path: data/indexnow-state.json
          key: indexnow-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: indexnow-v1-${{ runner.os }}-
      - name: Notify IndexNow of changed public pages
        id: indexnow
        continue-on-error: true
        run: python scripts/submit_indexnow.py
      - name: Save search-engine notification state
        if: steps.indexnow.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/indexnow-state.json
          key: indexnow-v1-${{ runner.os }}-${{ github.run_id }}
      - name: Report upstream failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'An upstream refresh failed. Retained data was published with its original timestamp and error status.'
          exit 1
