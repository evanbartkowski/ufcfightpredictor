name: Refresh fight data and website

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: firebase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install updater
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          npm install --global firebase-tools@14
      - name: Test source changes
        if: github.event_name != 'schedule'
        run: python -m pytest -q
      - name: Restore model cache
        uses: actions/cache/restore@v4
        with:
          path: data/model.joblib
          key: model-v1-${{ runner.os }}-${{ hashFiles('requirements.txt', 'predictor/model.py') }}-${{ github.run_id }}
          restore-keys: model-v1-${{ runner.os }}-${{ hashFiles('requirements.txt', 'predictor/model.py') }}-
      - name: Refresh verified data
        id: refresh
        continue-on-error: true
        run: python scripts/refresh_site.py --restore-url https://mma-oracle.web.app/api/sync-state.json.gz
      - name: Require complete publication
        run: python scripts/verify_publication.py
      - name: Save model cache
        uses: actions/cache/save@v4
        with:
          path: data/model.joblib
          key: model-v1-${{ runner.os }}-${{ hashFiles('requirements.txt', 'predictor/model.py') }}-${{ github.run_id }}
      - name: Authenticate to Firebase Hosting
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          project_id: mma-oracle
          workload_identity_provider: projects/196295291462/locations/global/workloadIdentityPools/mma-cipher-github/providers/github
          service_account: mma-cipher-publisher@mma-oracle.iam.gserviceaccount.com
      - name: Publish website and fight state together
        run: firebase deploy --only hosting --project mma-oracle --non-interactive --message '[mma-cipher-auto] Scheduled data and website update'
      - name: Verify production APIs, HTML, and persisted state
        run: python scripts/verify_publication.py --url https://mma-oracle.web.app
      - name: Retain recent automated snapshots
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/hosting_retention.py
      - name: Report upstream failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'An upstream refresh failed. Retained data was published with its original timestamp and error status.'
          exit 1
