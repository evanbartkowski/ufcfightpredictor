name: Monitor production freshness
on:
  schedule:
    - cron: '16 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/monitor_production.py --url https://mma-oracle.web.app --max-heartbeat 43200 --max-sync 86400 --max-odds 43200
