<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="eyeGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="48" y1="48" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="pupilGlow" cx="64" cy="64" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </radialGradient>
    <filter id="eyeBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Octagonal Shield Base -->
  <path d="M42 8h44l34 34v44l-34 34H42L8 86V42Z" fill="#090a10" stroke="url(#eyeGrad)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Minimal Outer Sacred Geometry Frame -->
  <polygon points="64,18 110,64 64,110 18,64" stroke="#1c2235" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- All-Seeing Eye Outer Contour (Smooth Geometric Arcs) -->
  <path d="M20 64 C 40 34, 88 34, 108 64 C 88 94, 40 94, 20 64 Z" 
        stroke="url(#eyeGrad)" stroke-width="3" fill="#0d101a" stroke-linejoin="round" filter="url(#eyeBloom)"/>

  <!-- Inner Upper & Lower Eyelid Radiance Accents -->
  <path d="M34 64 C 48 45, 80 45, 94 64" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6"/>
  <path d="M34 64 C 48 83, 80 83, 94 64" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Iris Circle -->
  <circle cx="64" cy="64" r="20" stroke="url(#irisGrad)" stroke-width="2" fill="#0c0e18"/>

  <!-- Minimalist Cyber Aperture Lines -->
  <circle cx="64" cy="64" r="14" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.7"/>

  <!-- Pupil (All-Seeing Core with Vertical Slit / Focus Beam) -->
  <circle cx="64" cy="64" r="8" fill="url(#pupilGlow)"/>
  <path d="M64 54 L66 64 L64 74 L62 64 Z" fill="#ffffff" filter="url(#eyeBloom)"/>

  <!-- Center Quantum Beacon Dot -->
  <circle cx="64" cy="64" r="2.5" fill="#ffffff"/>

  <!-- Subtly Emanating Vision Beams (Top, Bottom, Left, Right) -->
  <line x1="64" y1="12" x2="64" y2="24" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="104" x2="64" y2="116" stroke="#ff3366" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="64" x2="20" y2="64" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="108" y1="64" x2="116" y2="64" stroke="#ff3366" stroke-width="1.5" stroke-linecap="round"/>
</svg>
