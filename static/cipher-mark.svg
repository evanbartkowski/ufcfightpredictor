<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="cipherGrad" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff007a"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="28" y1="28" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="strikeVector" x1="38" y1="38" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff007a"/>
    </linearGradient>
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Octagon Base -->
  <path d="M42 6h44l36 36v44l-36 36H42L6 86V42Z" fill="#0c0d14"/>

  <!-- Outer Cyber Octagon Framework -->
  <path d="M42 6h44l36 36v44l-36 36H42L6 86V42Z" stroke="url(#cipherGrad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Octagon Corner Circuit Nodes -->
  <circle cx="42" cy="6" r="2" fill="#00f0ff" filter="url(#neonBloom)"/>
  <circle cx="86" cy="6" r="2" fill="#00f0ff"/>
  <circle cx="122" cy="42" r="2" fill="#8b5cf6"/>
  <circle cx="122" cy="86" r="2" fill="#ff007a"/>
  <circle cx="86" cy="122" r="2" fill="#ff007a"/>
  <circle cx="42" cy="122" r="2" fill="#8b5cf6"/>
  <circle cx="6" cy="86" r="2" fill="#00f0ff"/>
  <circle cx="6" cy="42" r="2" fill="#00f0ff"/>

  <!-- Inner Concentric Octagon Ring -->
  <path d="M46 18h36l28 28v36l-28 28H46L18 82V46Z" stroke="#1f2438" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Target & Cipher Lattice Hex Geometry -->
  <path d="M50 28h28l22 22v28l-22 22H50L28 78V50Z" fill="url(#innerGlow)" fill-opacity="0.12" stroke="url(#cipherGrad)" stroke-width="1.5"/>

  <!-- Stylized MMA Strike Blades / Cipher "C" Hex Monogram -->
  <path d="M78 38H56L40 54v20l16 16h22l10-10H60l-8-8v-8l8-8h28Z" fill="url(#strikeVector)" filter="url(#neonBloom)"/>

  <!-- Dynamic Vector Strike Core (Angular Impact Beam) -->
  <path d="M34 64h12l10-18h16l-14 18h26l-32 30 10-18H44Z" fill="#00f0ff" fill-opacity="0.9"/>

  <!-- Precision Crosshair Telemetry Marks -->
  <line x1="64" y1="10" x2="64" y2="20" stroke="#00f0ff" stroke-width="1.5"/>
  <line x1="64" y1="108" x2="64" y2="118" stroke="#ff007a" stroke-width="1.5"/>
  <line x1="10" y1="64" x2="20" y2="64" stroke="#00f0ff" stroke-width="1.5"/>
  <line x1="108" y1="64" x2="118" y2="64" stroke="#ff007a" stroke-width="1.5"/>

  <!-- Center Quantum Telemetry Node -->
  <circle cx="64" cy="64" r="3.5" fill="#ffffff" filter="url(#neonBloom)"/>
</svg>

