<title>{{ seo.title }}</title>
<meta name="description" content="{{ seo.description }}">
<meta name="keywords" content="UFC predictions, MMA predictions, UFC picks, UFC fight cards, UFC betting odds, fighter records, fight simulator, MMA analytics, MMACipher">
<meta name="author" content="Evan Bartkowski">
<meta name="publisher" content="MMA Cipher">
<meta name="application-name" content="MMA Cipher">
<meta name="robots" content="{{ 'index,follow,max-image-preview:large' if seo.indexable else 'noindex,follow' }}">
<meta name="theme-color" content="#030507">
<link rel="canonical" href="{{ seo.canonical }}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='cipher-mark.svg') }}">
<link rel="icon" type="image/png" sizes="96x96" href="{{ url_for('static', filename='icons/icon-96.png') }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
<meta property="og:type" content="{{ seo.og_type }}">
<meta property="og:site_name" content="MMA Cipher">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{ seo.title }}">
<meta property="og:description" content="{{ seo.description }}">
<meta property="og:url" content="{{ seo.canonical }}">
<meta property="og:image" content="{{ seo.image }}">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png"><meta property="og:image:alt" content="MMA Cipher — UFC predictions, fighter records, and model evidence">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{{ seo.title }}">
<meta name="twitter:description" content="{{ seo.description }}"><meta name="twitter:image" content="{{ seo.image }}">
<meta name="twitter:image:alt" content="MMA Cipher — UFC predictions, fighter records, and model evidence">
<script type="application/ld+json">{{ seo.graph|tojson }}</script>
